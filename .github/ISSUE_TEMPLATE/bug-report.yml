name: Bug report
description: Something doesn't work as described.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SubWake version
      description: Shown at the bottom of the window.
      placeholder: "2.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: "Windows 11 24H2"
  - type: textarea
    id: setup
    attributes:
      label: Audio setup
      description: The output SubWake plays on, your audio interface or sound card, and your subwoofer model.
      placeholder: "Speakers (Realtek(R) Audio) → KEF Kube 10b"
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The last 20 or so lines of the log (the window's "Open log" link, or %LOCALAPPDATA%\SubWake\subwake.log).
      render: text
