name: Subwoofer report
description: Tell us how SubWake works with your subwoofer, for the compatibility list.
labels: [compatibility]
body:
  - type: input
    id: model
    attributes:
      label: Subwoofer
      description: Brand and model.
    validations:
      required: true
  - type: dropdown
    id: works
    attributes:
      label: Does SubWake keep it awake?
      options: ["Yes", "Sometimes", "No"]
    validations:
      required: true
  - type: input
    id: standby
    attributes:
      label: Standby time
      description: How long until it goes to standby without a signal (from the manual, or measured).
      placeholder: "15 minutes"
  - type: input
    id: tone
    attributes:
      label: Tone and volume that worked
      placeholder: "35 Hz at −42 dBFS"
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: How it's connected, and anything else worth knowing.
